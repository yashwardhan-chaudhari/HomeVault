name: CI Pipeline

on:
  push:
    branches: [ main, improvement/homevault-quality ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated unit tests
        run: node --test tests/unit/**/*.test.js

      - name: Run build (Frontend bundle & Backend compilation)
        run: npm run build

      - name: Run API & E2E integration test suite
        env:
          JWT_SECRET: "ci_pipeline_jwt_secret_key_random_for_github_actions_test_run"
          PORT: 3000
        run: |
          npm run start &
          sleep 3
          npm test
